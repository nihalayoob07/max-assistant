<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>Max</title>
  <link rel="stylesheet" href="../node_modules/@fontsource/rajdhani/500.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/rajdhani/600.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/rajdhani/700.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/400.css">
  <link rel="stylesheet" href="../node_modules/@fontsource/jetbrains-mono/600.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop"></div>

  <header class="bar">
    <div class="brand">MAX</div>
    <div class="spacer"></div>
    <button class="pc-pill" id="pcPill" title="Active computer: click or say “switch pc”">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="12"/><path d="M8 20h8M12 16v4"/></svg>
      <span id="pcName">Laptop</span>
    </button>
    <div class="status" aria-live="polite"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
    <div class="clock" id="clock"></div>
    <div class="winbtns">
      <button data-win="min" title="Minimise">&#x2014;</button>
      <button data-win="max" title="Maximise">&#x25A1;</button>
      <button data-win="close" class="x" title="Close">&#x2715;</button>
    </div>
  </header>

  <nav class="rail">
    <button data-view="inbox" data-tip="Inbox" aria-label="Inbox" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/></svg>
      <span class="badge" id="badge" hidden></span>
    </button>
    <button data-view="chat" data-tip="Chat" aria-label="Chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/></svg>
    </button>
    <button data-view="leads" data-tip="Leads" aria-label="Leads">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    </button>
    <button data-view="today" data-tip="Today" aria-label="Today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17M11 6h9M11 12h9M11 18h9"/></svg>
    </button>
    <button data-view="calendar" data-tip="Calendar" aria-label="Calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4M7 14h2M11 14h2M15 14h2M7 17h2M11 17h2"/></svg>
    </button>
    <button data-view="shield" data-tip="Shield" aria-label="Shield">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
    </button>
    <button data-view="business" data-tip="Businesses" aria-label="Businesses">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6M3 21h18"/></svg>
    </button>
  </nav>

  <main id="view"></main>

  <script src="orb.js"></script>
  <script src="app.js"></script>
</body>
</html>
