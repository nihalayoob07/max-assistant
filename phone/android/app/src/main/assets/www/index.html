<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>Max</title>
  <link rel="stylesheet" href="fonts/rajdhani/500.css">
  <link rel="stylesheet" href="fonts/rajdhani/600.css">
  <link rel="stylesheet" href="fonts/rajdhani/700.css">
  <link rel="stylesheet" href="fonts/jetbrains-mono/400.css">
  <link rel="stylesheet" href="fonts/jetbrains-mono/600.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<!-- The desktop dashboard (app.js and style.css from max-assistant/app/ui, copied in at build time) in a phone
     layout: tabs at the bottom, the calendar and settings as bubbles from the top bar, a still aurora and core. -->
<body>
  <div class="backdrop"></div>
  <header class="bar">
    <div class="brand">MAX</div>
    <div class="spacer"></div>
    <button class="bar-btn" id="calBtn" popovertarget="calPop" aria-label="Calendar" title="Calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    </button>
    <button class="bar-btn" id="setBtn" popovertarget="setPop" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <span id="pcName" hidden></span>
    <div class="status" aria-live="polite"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>
  </header>

  <nav class="rail">
    <button data-view="inbox" aria-label="Inbox" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/></svg>
      <span class="badge" id="badge" hidden></span><i>Inbox</i>
    </button>
    <button data-view="chat" aria-label="Chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/></svg><i>Chat</i>
    </button>
    <button data-view="leads" aria-label="Leads">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><i>Leads</i>
    </button>
  </nav>

  <main id="view"></main>

  <div class="pop" id="calPop" popover></div>
  <div class="pop menu" id="setPop" popover>
    <button data-view="shield">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
      <span>Shield<small>What Max's guards caught</small></span>
    </button>
    <button data-view="business">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6M3 21h18"/></svg>
      <span>Businesses<small>Profiles and price limits</small></span>
    </button>
    <button data-view="whatsapp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5"/></svg>
      <span>WhatsApp<small>What the extension does</small></span>
    </button>
    <button data-view="voice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <span>Voice<small>How fast Max talks</small></span>
    </button>
    <button data-view="setup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>
      <span>Phone setup<small>So Max can ring you</small></span>
    </button>
  </div>

  <script src="max-shim.js"></script>
  <script src="app.js"></script>
  <script src="mobile.js"></script>
</body>
</html>
